# One-off cleanup: deletes the unused R2 bucket "almashriq-cache" once its 1-day lifecycle
# rule has emptied it (R2 only deletes empty buckets). Runs daily; once the bucket is gone
# it just reports that and succeeds. Delete this file after it has run successfully.
#
# Repository secret (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  Cloudflare API token with "Workers R2 Storage: Edit" on this account
name: Delete old cache bucket

on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC = 20:00 Pakistan time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1d9bac1d07767e76297b4a215f1d154f
    steps:
      - name: Delete almashriq-cache if empty
        run: |
          set -uo pipefail
          out=$(npx --yes wrangler@4.158.0 r2 bucket delete almashriq-cache 2>&1); code=$?
          echo "$out"
          if [ $code -eq 0 ]; then echo "Bucket deleted. You can remove this workflow now."; exit 0; fi
          if echo "$out" | grep -qiE "does not exist|not found|10006"; then echo "Bucket already gone. You can remove this workflow now."; exit 0; fi
          if echo "$out" | grep -qi "not empty"; then echo "Not empty yet; the lifecycle rule hasn't finished. Will try again tomorrow."; exit 0; fi
          exit $code
